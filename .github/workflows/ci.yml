name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check installer
        run: shellcheck install.sh
      - name: Test release installation
        run: |
          cargo build --release --locked
          test_dir="$(mktemp -d)"
          asset="jevctl-x86_64-unknown-linux-musl.tar.gz"
          mkdir "$test_dir/package"
          cp target/release/jevctl README.md LICENSE "$test_dir/package/"
          tar -C "$test_dir/package" -czf "$test_dir/$asset" jevctl README.md LICENSE
          tar -tzf "$test_dir/$asset" | sort > "$test_dir/contents"
          printf '%s\n' LICENSE README.md jevctl | diff -u - "$test_dir/contents"
          (cd "$test_dir" && sha256sum "$asset" > "$asset.sha256")
          JEVCTL_RELEASE_BASE_URL="file://$test_dir" \
            JEVCTL_INSTALL_DIR="$test_dir/install" \
            sh install.sh
          "$test_dir/install/jevctl" --version
