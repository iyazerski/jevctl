[package]
name = "jevctl"
version = "0.1.1"
edition = "2024"
description = "Fast semantic evaluation for agent workflows"
license = "MIT"
readme = "README.md"
keywords = ["ai", "agents", "cli", "mcp", "semantic-evaluation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "2.0", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["io-std", "macros", "rt", "time"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
